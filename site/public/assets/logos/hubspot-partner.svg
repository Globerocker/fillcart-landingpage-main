<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" role="img" aria-label="HubSpot Solutions Partner Program">
  <!-- Right ribbon panel -->
  <path d="M96 20 H330 L316 60 L330 100 H96 Z" fill="#45535E"/>
  <!-- Hex emblem -->
  <g>
    <polygon points="56,8 100,34 100,86 56,112 12,86 12,34" fill="#fff" stroke="#45535E" stroke-width="4"/>
    <!-- sunburst -->
    <g stroke="#C7D0D6" stroke-width="3" stroke-linecap="round">
      <line x1="56" y1="34" x2="56" y2="52"/>
      <line x1="38" y1="42" x2="48" y2="55"/>
      <line x1="74" y1="42" x2="64" y2="55"/>
      <line x1="34" y1="60" x2="50" y2="60"/>
      <line x1="78" y1="60" x2="62" y2="60"/>
      <line x1="40" y1="78" x2="49" y2="66"/>
      <line x1="72" y1="78" x2="63" y2="66"/>
    </g>
    <!-- Partner ribbon -->
    <rect x="10" y="52" width="92" height="18" fill="#F5871F"/>
    <text x="56" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="12" fill="#fff" letter-spacing="0.5">Partner</text>
  </g>
  <!-- HubSpot wordmark -->
  <text x="120" y="62" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="34" fill="#fff">HubSp</text>
  <text x="238" y="62" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="34" fill="#fff">t</text>
  <!-- sprocket for the 'o' -->
  <g transform="translate(232,42)">
    <circle cx="9" cy="9" r="7.5" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="9" cy="-0.5" r="2.2" fill="#F5871F"/>
    <line x1="9" y1="2" x2="9" y2="4" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="120" y="86" font-family="Arial,sans-serif" font-weight="600" font-size="12.5" letter-spacing="2.5" fill="#C7D0D6">SOLUTIONS PARTNER PROGRAM</text>
</svg>
